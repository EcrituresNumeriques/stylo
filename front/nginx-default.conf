server {
    listen       80;
    server_name  localhost;
    root   /usr/share/nginx/html;

    location / {
        try_files $uri /index.html;
        index  index.html;
    }

    # the files of a previous release no longer exist: answer 404 instead of
    # index.html, so that the browser reports a loading error
    location /assets/ {
        try_files $uri =404;
    }

    location = /index.html {
        expires 30s;
    }
}
