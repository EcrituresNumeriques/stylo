#import './Credentials.graphql'

query getWorkspaceArticles(
  $workspaceId: ID
  $isPersonalWorkspace: Boolean!
  $filter: FilterCorpusInput
) {
  tags {
    id
    owner
    description
    color
    name
  }

  workspace(workspaceId: $workspaceId) @skip(if: $isPersonalWorkspace) {
    id
    name
    color
    description
  }

  corpora(filter: { workspaceId: $workspaceId }) {
    id
    name
    articles {
      article {
        id
      }
    }
  }

  articles(filter: $filter) {
    id
    title
    updatedAt

    workingVersion {
      bibPreview
    }

    owner {
      id
      ...basicPublicUserFields
    }

    contributors {
      user {
        ...extendedPublicUserFields
      }
    }

    tags {
      name
      owner
      color
      id
    }
  }
}

mutation createArticle($input: CreateArticleInput!) {
  createArticle(input: $input) {
    id
    title
    updatedAt

    owner {
      id
      ...basicPublicUserFields
    }

    tags {
      name
      owner
      color
      id
    }
  }
}
