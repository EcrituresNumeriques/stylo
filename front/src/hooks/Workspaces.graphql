#import './Credentials.graphql'
## queries

query getWorkspaces {
  workspaces {
    id
    name
    description
    color
    bibliographyStyle
    formMetadata {
      data
      ui
    }
    createdAt
    updatedAt
    creator {
      ...basicPublicUserFields
    }
    stats {
      membersCount
      articlesCount
    }
  }
}

query getWorkspace($workspaceId: ID!) {
  workspace(workspaceId: $workspaceId) {
    id
    name
    description
    color
    bibliographyStyle
    formMetadata {
      data
      ui
    }
    createdAt
    updatedAt
    creator {
      ...basicPublicUserFields
    }
    stats {
      membersCount
      articlesCount
    }
  }
}

query getArticleWorkspaces($articleId: ID!) {
  article(article: $articleId) {
    workspaces {
      id
      color
      name
    }
  }
}

query getUserStats {
  user {
    stats {
      myArticlesCount
      contributedArticlesCount
    }
  }
}

query getWorkspaceMembers($workspaceId: ID!) {
  workspace(workspaceId: $workspaceId) {
    members {
      ...extendedPublicUserFields
    }
  }
}

## mutations

mutation inviteWorkspaceMember($workspaceId: ID!, $userId: ID!) {
  inviteWorkspaceMember(workspaceId: $workspaceId, userId: $userId) {
    id
    members {
      ...extendedPublicUserFields
    }
  }
}

mutation removeWorkspaceMember($workspaceId: ID!, $userId: ID!) {
  removeWorkspaceMember(workspaceId: $workspaceId, userId: $userId) {
    id
    members {
      ...extendedPublicUserFields
    }
  }
}

mutation createWorkspace($createWorkspaceInput: CreateWorkspaceInput!) {
  createWorkspace(createWorkspaceInput: $createWorkspaceInput) {
    id
  }
}

mutation create($data: CreateWorkspaceInput!) {
  createWorkspace(createWorkspaceInput: $data) {
    id
    name
    description
    color
    bibliographyStyle
    createdAt
    updatedAt
    stats {
      membersCount
      articlesCount
    }
  }
}

mutation leaveWorkspace($workspaceId: ID!) {
  leaveWorkspace(workspaceId: $workspaceId) {
    id
  }
}

mutation updateFormMetadata(
  $workspaceId: ID!
  $input: UpdateWorkspaceFormMetadataInput!
) {
  updateWorkspaceFormMetadata(details: $input, workspaceId: $workspaceId) {
    id
  }
}

# Add/remove article

mutation addWorkspaceArticle($workspaceId: ID!, $articleId: ID!) {
  addWorkspaceArticle(workspaceId: $workspaceId, articleId: $articleId) {
    id
  }
}

mutation removeWorkspaceArticle($workspaceId: ID!, $articleId: ID!) {
  removeWorkspaceArticle(workspaceId: $workspaceId, articleId: $articleId) {
    id
  }
}
