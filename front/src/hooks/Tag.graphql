query getTags {
  user {
    tags {
      name
      color
      id
    }
  }
}

mutation updateTag(
  $tag: ID!
  $color: HexColorCode!
  $name: String!
  $description: String!
) {
  updateTag(
    tagId: $tag
    input: { name: $name, description: $description, color: $color }
  ) {
    id
    name
    description
    color
  }
}

mutation createTag(
  $name: String!
  $description: String
  $color: HexColorCode!
) {
  createTag(input: { name: $name, description: $description, color: $color }) {
    id
    name
    description
    color
  }
}
