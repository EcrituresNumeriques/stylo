#import './Credentials.graphql'

fragment basicVersionFields on Version {
  id
  version
  revision
  message
  createdAt
  owner {
    ...basicPublicUserFields
  }
  type
}

mutation renameVersion($versionId: ID!, $name: String) {
  renameVersion(versionId: $versionId, name: $name) {
    id
    message
  }
}

query getArticleVersions($article: ID!) {
  article(articleId: $article) {
    id
    updatedAt
    versions {
      ...basicVersionFields
    }
  }
}

query getArticleVersion($versionId: ID!) {
  version(versionId: $versionId) {
    ...basicVersionFields
    md
    bib
    bibPreview
    yaml(options: { strip_markdown: true })
    metadata
  }
}

mutation createArticleVersion(
  $articleId: ID!
  $major: Boolean!
  $message: String
) {
  createArticleVersion(
    articleId: $articleId
    input: { major: $major, message: $message }
  ) {
    versions {
      ...basicVersionFields
    }
  }
}
