query search($query: String!) {
  search(query: $query) {
    articles {
      article {
        id
        title
        updatedAt
        owner {
          id
          displayName
          username
        }
      }
      score
    }
    corpora {
      corpus {
        id
        name
        updatedAt
        workspaceId
        creator {
          id
          displayName
          username
        }
      }
      score
    }
  }
}
