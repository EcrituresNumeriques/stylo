---

- hosts: stylo

  tasks:
    - name: Set application version
      ansible.builtin.set_fact: app_version="{{ app_version | default('latest') }}"

    - name: Install required system packages
      become: yes
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Add Docker GPG apt Key
      become: yes
      ansible.builtin.apt_key:
        url: https://download.docker.com/linux/{{ansible_distribution|lower}}/gpg
        state: present
        id: 7EA0A9C3F273FCD8

    - name: Add Docker Repository
      become: yes
      ansible.builtin.apt_repository:
        repo: deb https://download.docker.com/linux/{{ansible_distribution|lower}} {{ansible_distribution_release}} stable
        state: present

    - name: Update apt and install docker-ce
      become: yes
      ansible.builtin.apt:
        name:
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Update NGINX settings
      become: yes
      ansible.builtin.copy:
        src: ./{{ item.name }}.conf
        dest: /etc/nginx/sites-enabled/{{ item.name }}.conf
      with_items:
        - { name: "{{ site }}" }
        - { name: "pandoc-api.{{ site }}" }
        - { name: "export.{{ site }}" }
      notify: reload nginx

    - name: Update NGINX settings
      become: yes
      ansible.builtin.copy:
        src: ./stylo.ecrituresnumeriques.ca.conf
        dest: /etc/nginx/sites-enabled/stylo.ecrituresnumeriques.ca.conf
      when: site == "stylo.huma-num.fr"
      notify: reload nginx

    - name: Copy systemd service file
      become: yes
      ansible.builtin.copy:
        src: ./docker-compose-stylo.service
        dest: /etc/systemd/system/docker-compose-stylo.service
      notify: start docker-compose-stylo

    - name: Copy Nagios configuration
      become: yes
      ansible.builtin.copy:
        src: ./{{ env }}-nagios-nrpe-local.cfg
        dest: /etc/nagios/nrpe_local.cfg

    - name: Copy config files
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
      loop:
        - { src: "./.env", dest: "~/stylo/.env" }
        - { src: "./docker-compose.yaml", dest: "~/stylo/docker-compose.yaml" }

    - name: Copy backup files
      ansible.builtin.template:
        src: "./backup.sh"
        dest: "~/stylo/backup.sh"
        mode: "0775"
      when: site == "stylo.huma-num.fr"

    - name: Add the user 'stylo' to the group 'syslog'
      become: yes
      ansible.builtin.user:
        name: stylo
        shell: /bin/bash
        groups: syslog
        append: yes

    - name: Create a backup job (cron) that runs at midnight
      ansible.builtin.cron:
        name: "Backup data"
        minute: "0"
        hour: "0"
        job: "/home/stylo/stylo/backup.sh >> /var/log/backup.log 2>&1"
      when: site == "stylo.huma-num.fr"

    - name: Pull Docker containers
      ansible.builtin.shell:
        cmd: "docker compose pull"
        chdir: ~/stylo

    - name: Generate Shared GraphQL Token
      register: graphql_token
      ansible.builtin.shell:
        cmd: "docker compose run --no-deps --rm graphql-stylo npm run generate-service-token --silent"
        chdir: ~/stylo
      run_once: true
      no_log: true

    - set_fact:
        "se_graphql_token": "{{ graphql_token.stdout }}"

    - name: Update config files
      ansible.builtin.template:
        src: "./.env"
        dest: "~/stylo/.env"

    - name: Copy frontend assets files
      ansible.posix.synchronize:
        src: "{{ assets_path }}"
        dest: "~/stylo/front-assets/"
        delete: true

    # remet à zéro le compteur de démarrages (StartLimitBurst) pour ne pas
    # bloquer un déploiement qui suit de près un précédent
    - name: Reset failed state of containers service
      become: true
      ansible.builtin.command:
        cmd: "systemctl reset-failed docker-compose-stylo"
      changed_when: false
      failed_when: false

    - name: Restart containers
      become: true
      ansible.builtin.systemd:
        name: docker-compose-stylo
        state: restarted
        daemon_reload: true
      environment:
        NODE_OPTIONS: "{{ node_options_flag }}"

    # uniquement les images sans tag : un prune -a supprimerait les conteneurs
    # et images que docker compose est encore en train de démarrer
    - name: Prune dangling Docker images
      become: yes
      ansible.builtin.shell:
        cmd: "docker image prune -f"
      run_once: true

    # images taguées inutilisées (anciennes versions) ; après le restart pour ne pas
    # supprimer une image fraîchement tirée mais construite il y a plus de 24h
    - name: Prune unused Docker images older than 24h
      become: yes
      ansible.builtin.shell:
        cmd: "docker image prune -af --filter until=24h"
      run_once: true

  handlers:
    - name: reload nginx
      become: true
      service:
        name: nginx
        state: reloaded
    - name: start docker-compose-stylo
      become: true
      ansible.builtin.systemd:
        name: docker-compose-stylo
        state: started
        enabled: yes
