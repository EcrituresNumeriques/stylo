[defaults]
# Python du système, présent sur toutes les versions d'Ubuntu : évite que la
# découverte automatique change d'interpréteur (après une montée de version).
interpreter_python=/usr/bin/python3
host_key_checking=False
callbacks_enabled = ansible.posix.timer, ansible.posix.profile_tasks, ansible.posix.profile_roles

# Récapitulatifs des durées en fin d'exécution seulement, sans horodatage
# sous chaque tâche.
[callback_profile_tasks]
summary_only = true

[callback_profile_roles]
summary_only = true

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
pipelining = True
