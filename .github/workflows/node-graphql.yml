name: Node `graphql` application

on:
  push:
    branches:
    - master
    paths:
    - 'graphql/**'
    # the GraphQL tests validate the operations of the front against the schema
    - 'front/src/**/*.graphql'
    - '.github/workflows/node*.yml'
  pull_request:
    paths:
    - 'graphql/**'
    - 'front/src/**/*.graphql'
    - '.github/workflows/node*.yml'

jobs:
  build:
    uses: EcrituresNumeriques/stylo/.github/workflows/node.yml@master
    with:
      app-dir: graphql
