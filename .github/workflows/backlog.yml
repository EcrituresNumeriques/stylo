name: Backlog

# À la fusion d'une PR sur master, passe les issues qu'elle corrige en « À tester »
# dans le projet « Backlog Stylo ».
#
# pull_request_target permet d'accéder au secret PROJECT_TOKEN pour les PR ouvertes
# depuis un fork. Le code de la PR n'est jamais exécuté : on récupère uniquement
# le script de la branche master.

on:
  pull_request_target:
    types: [closed]
    branches: [master]

permissions:
  contents: read

jobs:
  issues-to-test:
    if: ${{ github.event.pull_request.merged }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
          sparse-checkout: .github/scripts
          persist-credentials: false

      - uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const { markMergedIssuesToTest } = await import('${{ github.workspace }}/.github/scripts/backlog.mjs')
            await markMergedIssuesToTest({ github, context, core })
