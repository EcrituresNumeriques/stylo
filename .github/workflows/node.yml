name: Node applications

on:
  workflow_call:
    inputs:
      app-dir:
        type: string
        required: true

jobs:
  build:
    # libcrypto.so.1.1 is missing in ubuntu-24.04
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      # lists the files changed by the pull request
      pull-requests: read

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        run: npm clean-install --no-audit --no-fund

      - name: Run tests
        working-directory: ${{ inputs.app-dir }}
        run: |
          cp ../stylo-example.env ../.env
          npm test

      - name: Coverage report
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: ${{ inputs.app-dir }}
          working-directory: ${{ inputs.app-dir }}
          # the report only goes to the job summary, because pull requests
          # coming from a fork have a read-only token and cannot be commented
          comment-on: none

      - name: Build (if necessary)
        working-directory: ${{ inputs.app-dir }}
        run: npm run build --if-present
